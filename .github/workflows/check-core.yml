name: check-core
# The heavy steps and their inputs (#287). On a pull request a heavy step runs only when the PR changes a
# file that matches one of its line's patterns (extended regular expressions on the path in the repository;
# a pattern starting with + matches a file the PR adds or removes, by its path), or anything under
# .github/workflows/ or .gitattributes; every other step runs always. On a push to main, the nightly schedule
# and a manual run (workflow_dispatch) every step runs, with no filter. In doubt a path goes on the line - a
# test that reads another test's folder or fixture names it too. The step "Which heavy steps run" reads the
# lines below as they are (#need <key> <patterns> # <what the step reads>); a pattern it cannot read, a line
# without patterns or a key a step's if: names that has no line runs every step or fails it, never skips.
# A line whose one pattern is !pr runs on no pull request, whatever it changes, and on every other run (#561): pwsh on Windows
# of the non-hook script sets (pwsh on Linux runs them on a PR; the guard's and the hooks' keep it) and reset-coordinator (tests only).
#need selftest   ^scripts/selftest\. ^scripts/hooks/ ^tests/selftest/ ^CORE-FINDINGS\.template\.md$ ^scripts/start-worker\. ^scripts/cleanup-worker\. ^settings\.example ^scripts/check-contract\. ^scripts/check-core\. ^scripts/check-scripts\. ^scripts/statusline\.  # selftest's guard settings, transcripts, probes, the throwaway assistant, prepare / verify, sandbox: selftest, the guard, the fixtures, the findings template, the assistant's start, cleanup and settings examples, and the scripts selftest scripts runs (#312)
#need contract   ^scripts/check-contract\. ^tests/check-contract/ ^tests/selftest/contract\.md$  # check-contract on the fixture contracts (and selftest's fixture contract, read with a BOM)
#need tokens     ^scripts/session-tokens\. ^tests/session-tokens/  # session-tokens on its fixture transcripts
#need insights   ^scripts/session-insights\. ^tests/session-insights/ ^tests/retro/claude/  # session-insights on its fixture transcripts (and the retro's fixture transcripts)
#need compaction ^scripts/hooks/(before|after)-compact\. ^tests/compaction/ ^ONE-TIME\.md$ ^TOOLKIT\.md$ ^settings\.example  # the compaction checkpoint (#342): the two hooks against a stub claude, the entry named in ONE-TIME and TOOLKIT, none in the settings examples
#need retro      ^scripts/retro\. ^scripts/session-insights\. ^tests/retro/ +.  # retro (it runs session-insights; a proposal's names are checked against the core's own file list)
#need statusline ^scripts/statusline\. ^tests/statusline/ ^tests/selftest/status\.json$  # the status line (and selftest's status fixture)
#need runstats   ^scripts/run-stats\. ^tests/run-stats/  # run-stats on its fixture run logs
#need guard      ^scripts/hooks/ ^tests/safety-guard/  # the guard's cases in every shell (the step without jq also runs selftest's settings: selftest's line too)
#need workers    ^scripts/start-worker\. ^scripts/cleanup-worker\. ^scripts/check-contract\. ^scripts/merge-queue\. ^scripts/hooks/ ^roles/ ^settings\.example ^tests/workers/ ^tests/check-contract/  # start-worker and cleanup-worker: the scripts they run, the guard and its settings examples, the role files, the contract fixtures
#need mergequeue ^scripts/merge-queue\. ^tests/merge-queue/  # merge-queue against a stub gh
#need bounds     ^scripts/check-bounds\. ^tests/check-bounds/  # check-bounds on a throwaway repository
#need reportissue ^scripts/report-issue\. ^tests/report-issue/  # report-issue against a stub gh
#need watch      ^scripts/watch-sessions\. ^tests/watch-sessions/  # watch-sessions against a stub claude
#need ccformats  ^scripts/cc-formats\. ^tests/cc-formats/ ^scripts/selftest\.  # cc-formats against a stub claude (and selftest env's line)
#need runs       ^scripts/runs\. ^scripts/session-tokens\. ^tests/runs/  # runs against fixture transcripts and a stub claude (it reads them through session-tokens)
#need reset      !pr  # reset-coordinator on scratch projects in a temp folder, against a stub gh and a stub claude
#need winpwsh    !pr  # pwsh on Windows in a non-hook script set: the gate line before a Windows step's last command, its ps pwsh
#need variants   ^scripts/ ^tests/ ^CONTRACT\.md$ \.(sh|ps1)$  # both variants print the same (pwsh on Linux), all but check-core and selftest scripts: every script, its fixtures, the example contract, every script file check-scripts counts
#need citimes    ^scripts/ci-times\. ^tests/ci-times ^tests/safety-guard/run\.sh$ ^tests/workers/ ^tests/report-issue/  # the shards hold every step, ci-times on its fixtures, a failing guard case prints the hook's stderr, the split sets' parts (it lists and runs them)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:
# A pull request's stale runs are cancelled by its next push; a run on main (its own group) never is.
concurrency:
  group: check-core-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
# One list of steps (a YAML anchor), run by the shards of the three OS in parallel: a step's if: names its shards, so every
# step runs exactly once per OS (tests/ci-times/run.sh proves it against steps-main.txt); the required checks are the
# check-<os> jobs below, red when any shard of that OS failed, was cancelled or was skipped. The split follows the
# measured seconds of main's runs (tests/ci-times.tsv): the longest sets on shards of their own, the rest together.
# #405: 20 shards a run (Ubuntu 8, Windows 10, macOS 2: the owner's target, the plan's 20 slots; a second run waits for them);
# the long sets run in parts by their data, every case once (tests/ci-times/run.sh proves it): the two guard sets in five parts
# (SG_PART=<k>/5, a case's part by its index in cases.txt), the two workers sets in three and report-issue on Windows in two
# (WK_PART, RI_PART: a section's part by its index among the `# --- ` lines of its run.sh). #426 (426-5): the common steps on <os>-1,
# every other step packed longest first into the shortest shard of its OS (the parts of one set on shards of their own) by the largest
# seconds of runs 42376067684 and 42379649294 (main) and 42382598781 (#554; a Windows step varies by about a fifth from run to run):
# every shard about 6 to 8 minutes, Windows bound by watch-sessions' one step; a longer one is rebalanced at the next CI audit. A shard past SHARD_LIMIT is a warning below.
  shard-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        shard: [ubuntu-1, ubuntu-2, ubuntu-3, ubuntu-4, ubuntu-5, ubuntu-6, ubuntu-7, ubuntu-8]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: a failing command anywhere in a pipeline fails the step
    steps: &steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # a pull request's merge commit and its first parent, the base it is tested against
      - name: Which heavy steps run (a pull request - by the files it changes; any other run - all)
        id: need
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # the files the pull request changes (both paths of a rename; non-ASCII names as they are), and
          # those it adds or removes; any other event, a change under .github/workflows/ or to .gitattributes,
          # or a diff that cannot be read: every step runs
          all=1
          if [ "$EVENT" = pull_request ] && changed="$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)" &&
            addrm="$(git -c core.quotePath=false diff --name-only --no-renames --diff-filter=AD HEAD^1 HEAD)"; then
            all=""; printf '%s\n' "$changed" | grep -E '^(\.github/workflows/|\.gitattributes$)' > /dev/null && all=1
            printf 'changed:\n%s\n' "$changed"
          fi
          w=.github/workflows/check-core.yml
          map="$(grep '^#need ' "$w" | sed 's/ *# .*//')"
          # every key a step's if: names has its line
          for k in $(grep -o 'steps\.need\.outputs\.[A-Za-z0-9_-]*' "$w" | sed 's/.*\.//' | sort -u); do
            printf '%s\n' "$map" | awk -v k="$k" '$2 == k { f = 1 } END { exit !f }' || { echo "no #need line for the key $k"; exit 1; }
          done
          set -f   # the patterns are not file names
          while read -r _ key pats; do
            need=false
            if [ "$pats" = '!pr' ]; then [ "$EVENT" = pull_request ] || need=true
            elif [ -n "$all" ]; then need=true
            elif [ -z "$pats" ]; then echo "$key has no patterns: it runs"; need=true
            else
              for p in $pats; do
                case "$p" in +*) l="$addrm"; p="${p#+}" ;; *) l="$changed" ;; esac
                # grep: 0 a match, 1 none, 2 a pattern it cannot read - then the step runs
                rc=0; { [ -z "$l" ] || printf '%s\n' "$l"; } | grep -E -- "$p" > /dev/null || rc=$?
                case "$rc" in 0) need=true ;; 1) ;; *) echo "$key: the pattern $p cannot be read (grep exit $rc): it runs"; need=true ;; esac
              done
            fi
            echo "$key=$need" | tee -a "$GITHUB_OUTPUT"
          done <<< "$map"
      - name: macOS runs the scripts with the system bash 3.2, not Homebrew's
        if: matrix.shard == 'macos-1'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"
      - name: ci-times - the second macOS shard runs the scripts with the system bash 3.2 too (#405)
        if: matrix.shard == 'macos-2'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/sysbash:$PATH" bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]' || { echo "expected bash 3.2 on macOS"; exit 1; }
      - name: Which bash
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: |
          command -v bash
          bash --version | head -n 1
          if [ "$RUNNER_OS" = macOS ]; then bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]' || { echo "expected bash 3.2 on macOS"; exit 1; }; fi
      - name: Links and section references (bash)
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: bash scripts/check-core.sh
      - name: Links and section references (PowerShell)
        if: matrix.shard == 'windows-1'
        shell: powershell
        run: .\scripts\check-core.ps1
      - name: Every script parses, and a broken one is reported (bash)
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: |
          bash scripts/check-scripts.sh scripts
          out="$(bash scripts/check-scripts.sh tests/check-scripts/broken)" && { echo "broken scripts must fail"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^tests/check-scripts/broken/bad\.sh:[0-9]*: '
          printf '%s\n' "$out" | grep -q "^tests/check-scripts/broken/bad\.ps1:3: Variable reference is not valid. ':' was not followed by a valid variable name character"
          printf '%s\n' "$out" | grep -qx 'check-scripts: 3 files, 2 errors'
          bash scripts/check-scripts.sh tests/check-scripts/pwsh7 | grep -qx 'check-scripts: 1 files, 0 errors'
          # the whole repository (UPDATE-CORE runs it on a core copy): the broken fixtures are left out
          out="$(bash scripts/check-scripts.sh .)" || { printf '%s\n' "$out"; echo "the whole repository must pass"; exit 1; }
          printf '%s\n' "$out" | grep -q 'broken' && { echo "the broken fixtures were checked"; exit 1; }
          printf '%s\n' "$out" | grep -q '^check-scripts: [0-9]* files, 0 errors$'
      - name: Every script parses, and a broken one is reported (Windows PowerShell 5.1)
        if: matrix.shard == 'windows-1'
        shell: powershell
        run: |
          .\scripts\check-scripts.ps1 scripts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = @(.\scripts\check-scripts.ps1 tests/check-scripts/broken)
          if ($LASTEXITCODE -ne 1) { "broken scripts must fail"; exit 1 }
          $out
          if (-not ($out -match '^tests/check-scripts/broken/bad\.sh:\d+: ')) { 'bad.sh not reported'; exit 1 }
          if (-not ($out -match "^tests/check-scripts/broken/bad\.ps1:3: Variable reference is not valid")) { 'bad.ps1 not reported'; exit 1 }
          if (-not ($out -ceq 'check-scripts: 3 files, 2 errors')) { 'wrong summary'; exit 1 }
          # a #Requires -Version 7 file: 5.1 cannot parse it, so check-scripts hands it to pwsh
          $t = $null; $x = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\tests\check-scripts\pwsh7\needs7.ps1", [ref]$t, [ref]$x)
          if ($x.Count -eq 0) { "needs7.ps1 must not parse under 5.1"; exit 1 }
          $out = @(.\scripts\check-scripts.ps1 tests/check-scripts/pwsh7)
          if ($LASTEXITCODE -ne 0 -or -not ($out -ceq 'check-scripts: 1 files, 0 errors')) { $out; 'needs7.ps1 not handed to pwsh'; exit 1 }
          # the whole repository (UPDATE-CORE runs it on a core copy): the broken fixtures are left out
          $out = @(.\scripts\check-scripts.ps1 .)
          if ($LASTEXITCODE -ne 0 -or ($out -match 'broken')) { $out; 'the whole repository must pass without the broken fixtures'; exit 1 }
          exit 0
      - name: check-scripts.sh and .ps1 print the same on Windows (Git Bash, Windows PowerShell 5.1)
        if: matrix.shard == 'windows-5'
        run: |
          for d in scripts tests/check-scripts/broken tests/check-scripts/pwsh7 . tests; do
            a="$(bash scripts/check-scripts.sh "$d")" || true
            b="$(powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-scripts.ps1 "$d" | tr -d '\r')" || true
            [ "$a" = "$b" ] || { echo "differ on $d"; printf '%s\n--\n%s\n' "$a" "$b"; exit 1; }
          done
      - name: selftest - the guard's settings and transcripts (bash)
        if: (matrix.shard == 'ubuntu-4' || matrix.shard == 'macos-1') && steps.need.outputs.selftest == 'true'
        run: |
          # every settings fixture against tests/selftest/hooks/expected.txt (with jq here; the step
          # without jq runs the awk reader), and a step given another step's parameter is a usage error
          bash tests/selftest/hooks.sh sh
          s=scripts/selftest.sh
          export CLAUDE_CONFIG_DIR="$PWD/tests/selftest/claude"
          bash $s hookcheck --session blocked0
          for id in nonblock noblock0 missing0 editblk0; do
            if bash $s hookcheck --session $id; then echo "$id must fail"; exit 1; fi
          done
          # the edit probe: only the guard's working-copy block passes
          bash $s hookcheck --session editblk0 --expect edit
          for id in editok00 editnone blocked0 nonblock; do
            if bash $s hookcheck --session $id --expect edit; then echo "$id must fail --expect edit"; exit 1; fi
          done
      - name: selftest - the guard's settings (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-4' && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/hooks.sh ps pwsh
      - name: selftest - the guard's settings (Windows PowerShell 5.1 and pwsh)
        if: matrix.shard == 'windows-7' && steps.need.outputs.selftest == 'true'
        run: |
          bash tests/selftest/hooks.sh ps powershell
          bash tests/selftest/hooks.sh ps pwsh
      - name: selftest - the guard probes against a stub claude (bash)
        if: (matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1') && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/probes.sh sh
      - name: selftest - the guard probes against a stub claude (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-3' && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/probes.sh ps pwsh
      - name: selftest - the guard probes against a stub claude (Windows PowerShell 5.1)
        if: matrix.shard == 'windows-4' && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/probes.sh ps powershell
      - name: selftest - the throwaway assistant against a stub claude (bash)
        if: (matrix.shard == 'ubuntu-5' || matrix.shard == 'macos-2') && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/assistant.sh sh
      - name: selftest - the throwaway assistant against a stub claude (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-1' && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/assistant.sh ps pwsh
      - name: selftest - the throwaway assistant against a stub claude (Windows PowerShell 5.1)
        if: matrix.shard == 'windows-4' && steps.need.outputs.selftest == 'true'
        run: bash tests/selftest/assistant.sh ps powershell
      - name: selftest - the guard's settings and transcripts (Windows PowerShell 5.1)
        if: matrix.shard == 'windows-8' && steps.need.outputs.selftest == 'true'
        shell: powershell
        run: |
          $h = 'tests/selftest/hooks'
          foreach ($f in @('good', 'shellexit', 'comment', 'minified', 'twoentries', 'matcherall', 'singlequote', 'protectedempty', 'branches', 'branchescomma')) { .\scripts\selftest.ps1 hooks -Settings "$h/$f.json"; if ($LASTEXITCODE -ne 0) { "$f.json must pass"; exit 1 } }
          foreach ($f in @('shell', 'backslash', 'envvar', 'post', 'shellfar', 'space', 'bashonly', 'noblock', 'matcherafter', 'trailingcomma', 'protectedmatcher', 'protectedpartial', 'protectedrelative', 'protectedmissing', 'branchesbad')) { .\scripts\selftest.ps1 hooks -Settings "$h/$f.json"; if ($LASTEXITCODE -ne 1) { "$f.json must fail"; exit 1 } }
          # protected.json with its @CORE@ as this checkout's folder (an absolute path to a folder)
          $p = Join-Path $env:RUNNER_TEMP 'protected.json'
          [IO.File]::WriteAllText($p, [IO.File]::ReadAllText("$PWD\$h\protected.json").Replace('@CORE@', $PWD.Path.Replace('\', '/')))
          .\scripts\selftest.ps1 hooks -Settings $p; if ($LASTEXITCODE -ne 0) { 'protected.json must pass'; exit 1 }
          $env:CLAUDE_CONFIG_DIR = "$PWD\tests\selftest\claude"
          .\scripts\selftest.ps1 hookcheck -Session blocked0; if ($LASTEXITCODE -ne 0) { 'blocked0 must pass'; exit 1 }
          foreach ($id in @('nonblock', 'noblock0', 'missing0', 'editblk0')) { .\scripts\selftest.ps1 hookcheck -Session $id; if ($LASTEXITCODE -ne 1) { "$id must fail"; exit 1 } }
          .\scripts\selftest.ps1 hookcheck -Session editblk0 -Expect edit; if ($LASTEXITCODE -ne 0) { 'editblk0 must pass -Expect edit'; exit 1 }
          foreach ($id in @('editok00', 'editnone', 'blocked0', 'nonblock')) { .\scripts\selftest.ps1 hookcheck -Session $id -Expect edit; if ($LASTEXITCODE -ne 1) { "$id must fail -Expect edit"; exit 1 } }
          # on Windows only a drive path counts as the protected root
          .\scripts\selftest.ps1 hooks -Settings "$h/os/posixroot.json"; if ($LASTEXITCODE -ne 1) { 'os/posixroot.json must fail on Windows'; exit 1 }
          .\scripts\selftest.ps1 hooks -Settings "$h/os/gitbashroot.json"; if ($LASTEXITCODE -ne 0) { 'os/gitbashroot.json must pass on Windows'; exit 1 }
          exit 0
      - name: The example contract in CONTRACT.md passes the contract check (bash)
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: |
          awk '/^```yaml$/ {on = 1; next} on && /^```/ {exit} on' CONTRACT.md > "$RUNNER_TEMP/example.md"
          bash scripts/check-contract.sh "$RUNNER_TEMP/example.md"
          sed "s/^  escalate_to: fable /  escalate_to: opus  /" "$RUNNER_TEMP/example.md" > "$RUNNER_TEMP/same.md"
          bash scripts/check-contract.sh "$RUNNER_TEMP/same.md" | grep -q "is not stronger than budget.model" || { echo "an escalate_to no stronger than the model must warn"; exit 1; }
      - name: The example contract in CONTRACT.md passes the contract check (PowerShell)
        if: matrix.shard == 'windows-1'
        shell: powershell
        run: |
          $s = [IO.File]::ReadAllText("$PWD\CONTRACT.md")
          $m = [regex]::Match($s, '(?s)```yaml\r?\n(.*?)```')
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\example.md", $m.Groups[1].Value)
          .\scripts\check-contract.ps1 "$env:RUNNER_TEMP\example.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\same.md", ($m.Groups[1].Value -replace '(?m)^  escalate_to: fable ', '  escalate_to: opus  '))
          if (-not ((.\scripts\check-contract.ps1 "$env:RUNNER_TEMP\same.md") -match 'is not stronger than budget.model')) { 'an escalate_to no stronger than the model must warn'; exit 1 }
          exit 0
      - name: check-contract on the fixture contracts (bash)
        if: (matrix.shard == 'ubuntu-8' || matrix.shard == 'macos-2') && steps.need.outputs.contract == 'true'
        run: bash tests/check-contract/run.sh sh
      - name: check-contract on the fixture contracts (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-1' && steps.need.outputs.contract == 'true'
        run: bash tests/check-contract/run.sh ps pwsh
      - name: check-contract on the fixture contracts (Windows PowerShell 5.1 and pwsh, console code page 866)
        if: matrix.shard == 'windows-10' && steps.need.outputs.contract == 'true'
        run: |
          bash tests/check-contract/run.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
          bash tests/check-contract/run.sh ps pwsh
      - name: check-scripts on temporary folders (bash)
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: bash tests/check-scripts/run.sh sh
      - name: check-scripts on temporary folders (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-1'
        run: bash tests/check-scripts/run.sh ps pwsh
      - name: check-scripts on temporary folders (Git Bash, Windows PowerShell 5.1 and pwsh)
        if: matrix.shard == 'windows-9'
        run: |
          bash tests/check-scripts/run.sh sh
          bash tests/check-scripts/run.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
          bash tests/check-scripts/run.sh ps pwsh
      - name: check-core on a core copy with a wrapped feature field and a script without its pair (bash)
        if: matrix.shard == 'ubuntu-1' || matrix.shard == 'macos-1'
        run: bash tests/check-core/run.sh sh
      - name: check-core on a core copy with a wrapped feature field and a script without its pair (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-1'
        run: bash tests/check-core/run.sh ps pwsh
      - name: check-core on a core copy with a wrapped feature field and a script without its pair (Windows)
        if: matrix.shard == 'windows-3'
        run: |
          bash tests/check-core/run.sh sh
          bash tests/check-core/run.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
          bash tests/check-core/run.sh ps pwsh
      - name: session-tokens counts the fixture exactly (bash)
        if: (matrix.shard == 'ubuntu-4' || matrix.shard == 'macos-1') && steps.need.outputs.tokens == 'true'
        run: bash tests/session-tokens/run.sh sh
      - name: session-tokens counts the fixture exactly (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-5' && steps.need.outputs.tokens == 'true'
        run: bash tests/session-tokens/run.sh ps pwsh
      - name: session-tokens counts the fixture exactly (PowerShell)
        if: matrix.shard == 'windows-6' && steps.need.outputs.tokens == 'true'
        run: |
          # through -File, as the docs give it, in both PowerShells
          bash tests/session-tokens/run.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
          bash tests/session-tokens/run.sh ps pwsh
      - name: session-insights reads the fixture transcripts (bash)
        if: (matrix.shard == 'ubuntu-2' || matrix.shard == 'macos-2') && steps.need.outputs.insights == 'true'
        run: bash tests/session-insights/run.sh sh
      - name: session-insights reads the fixture transcripts (PowerShell 7, Linux)
        if: matrix.shard == 'ubuntu-8' && steps.need.outputs.insights == 'true'
        run: bash tests/session-insights/run.sh ps pwsh
      - name: session-insights reads the fixture transcripts (PowerShell)
        if: matrix.shard == 'windows-8' && steps.need.outputs.insights == 'true'
        run: |
          # through -File, as the docs give it, in both PowerShells
          bash tests/session-insights/run.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
          bash tests/session-insights/run.sh ps pwsh
      - name: compaction keeps the checkpoint through the two hooks (bash)
        if: (matrix.shard == 'ubuntu-8' || matrix.shard == 'macos-1') && steps.need.outputs.compaction == 'true'
        run: bash tests/compaction/run.sh sh
      - name: compaction keeps the checkpoint through the two hooks (PowerShell 7, Linux)
