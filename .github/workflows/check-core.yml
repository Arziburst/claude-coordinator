      - name: Both variants print the same - check-core and selftest scripts, which read every document (pwsh on Linux)
        if: matrix.shard == 'ubuntu-3'
        run: |
          diff <(bash scripts/check-core.sh) <(pwsh -NoProfile -File scripts/check-core.ps1)
          diff <(bash scripts/selftest.sh scripts) <(pwsh -NoProfile -File scripts/selftest.ps1 scripts)
      - name: Both variants print the same (pwsh on Linux)
        if: matrix.shard == 'ubuntu-1' && steps.need.outputs.variants == 'true'
        run: |
          for f in tests/selftest/hooks/*.json tests/selftest/hooks/os/*.json; do diff <(bash scripts/selftest.sh hooks --settings $f) <(pwsh -NoProfile -File scripts/selftest.ps1 hooks -Settings $f); done
          for id in blocked0 nonblock noblock0 missing0 editblk0; do diff <(CLAUDE_CONFIG_DIR=tests/selftest/claude bash scripts/selftest.sh hookcheck --session $id) <(CLAUDE_CONFIG_DIR=tests/selftest/claude pwsh -NoProfile -File scripts/selftest.ps1 hookcheck -Session $id); done
          for id in editblk0 editok00 editnone blocked0; do diff <(CLAUDE_CONFIG_DIR=tests/selftest/claude bash scripts/selftest.sh hookcheck --session $id --expect edit) <(CLAUDE_CONFIG_DIR=tests/selftest/claude pwsh -NoProfile -File scripts/selftest.ps1 hookcheck -Session $id -Expect edit); done
          for id in probeblk probeqt0 blocked0 nonblock; do diff <(CLAUDE_CONFIG_DIR=tests/selftest/claude bash scripts/selftest.sh hookcheck --session $id --expect probe) <(CLAUDE_CONFIG_DIR=tests/selftest/claude pwsh -NoProfile -File scripts/selftest.ps1 hookcheck -Session $id -Expect probe); done
          diff <(bash scripts/check-scripts.sh scripts tests/check-scripts/broken tests/check-scripts/pwsh7) <(pwsh -NoProfile -File scripts/check-scripts.ps1 scripts tests/check-scripts/broken tests/check-scripts/pwsh7)
          diff <(bash scripts/check-scripts.sh . tests) <(pwsh -NoProfile -File scripts/check-scripts.ps1 . tests)
          f="$RUNNER_TEMP/example.md"
          # both scripts print the same `cannot read` on a missing file, so an empty diff there proves nothing: its writer is the example contract's step, on this shard
          [ -s "$f" ] || { echo "$f is missing or empty: the example contract's step must run first, on this shard"; exit 1; }
          wc -l "$f"
          diff <(bash scripts/check-contract.sh "$f") <(pwsh -NoProfile -File scripts/check-contract.ps1 "$f")
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          for j in \
            '{"model":{"display_name":"Opus 5.5"},"effort":{"level":"high"},"context_window":{"used_percentage":84.2,"context_window_size":1000000,"current_usage":{"input_tokens":800000,"cache_read_input_tokens":37000}},"rate_limits":{"five_hour":{"used_percentage":14.9},"seven_day":{"used_percentage":92}}}' \
            '{"context_window":{"used_percentage":50,"context_window_size":1250000,"current_usage":null},"rate_limits":{"five_hour":{"used_percentage":null}}}'; do
            a="$(printf '%s' "$j" | HOME="$home" bash scripts/statusline.sh)"
            b="$(printf '%s' "$j" | HOME="$home" LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/statusline.ps1)"
            [ "$a" = "$b" ] || { echo "statusline differs: sh '$a' / ps '$b'"; exit 1; }
          done
          export CLAUDE_CONFIG_DIR="$PWD/tests/session-tokens/claude"
