            awk -v os=macos '$1 == "wall" || $2 == os { if ($1 == "over") print "::warning::ci-times: " $0; else print }' || echo "::warning::ci-times could not read this run"
          gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.name | startswith("shard-macos ")) | select(.completedAt | startswith("0001") | not) | if (.steps | length) == 0 then "\(.name) no runner" else "\(.name) \((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601))" end' |
            awk -v lim="$SHARD_LIMIT" '/ no runner$/ { print; next } { s = $NF; sub(/ [0-9]+$/, ""); if (s > lim) print "::warning::" $0 " took " s " s, over the shard limit of " lim; else print $0 " took " s " s" }' || echo "::warning::the shards times could not be read"
          [ "$RESULT" = success ] || { echo "shard-macos: $RESULT - a shard failed, was cancelled or skipped"; exit 1; }
  check-windows:
    name: check (windows-latest)
    needs: shard-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shard of windows passed; its steps' seconds against tests/ci-times.tsv, a step over its line a warning, a shard past SHARD_LIMIT too
        env:
