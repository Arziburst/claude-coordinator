  shard-macos:
    strategy:
      fail-fast: false
      matrix:
        shard: [macos-1, macos-2]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: a failing command anywhere in a pipeline fails the step
    steps: *steps
  shard-windows:
    strategy:
      fail-fast: false
      matrix:
        shard: [windows-1, windows-2, windows-3, windows-4, windows-5, windows-6, windows-7, windows-8, windows-9, windows-10]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: a failing command anywhere in a pipeline fails the step
    steps: *steps
# The required checks (branch protection names them): one per OS, always run, red unless every shard of that OS succeeded.
# They run on ubuntu-latest, whatever OS they stand for: the name is the check's, the work is reading the run.
  check-ubuntu:
    name: check (ubuntu-latest)
    needs: shard-ubuntu
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shard of ubuntu passed; its steps' seconds against tests/ci-times.tsv, a step over its line a warning, a shard past SHARD_LIMIT too
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.shard-ubuntu.result }}
          SHARD_LIMIT: 900   # seconds a shard may take before its line is a warning (#405): 15 minutes, the longest shard by the numbers is about 8 (#426); never a failure
        run: |
          gh run view "$GITHUB_RUN_ID" --json jobs > "$RUNNER_TEMP/jobs.json" && bash scripts/ci-times.sh --baseline tests/ci-times.tsv "$RUNNER_TEMP/jobs.json" |
            awk -v os=ubuntu '$1 == "wall" || $2 == os { if ($1 == "over") print "::warning::ci-times: " $0; else print }' || echo "::warning::ci-times could not read this run"
          gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.name | startswith("shard-ubuntu ")) | select(.completedAt | startswith("0001") | not) | if (.steps | length) == 0 then "\(.name) no runner" else "\(.name) \((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601))" end' |
            awk -v lim="$SHARD_LIMIT" '/ no runner$/ { print; next } { s = $NF; sub(/ [0-9]+$/, ""); if (s > lim) print "::warning::" $0 " took " s " s, over the shard limit of " lim; else print $0 " took " s " s" }' || echo "::warning::the shards times could not be read"
          [ "$RESULT" = success ] || { echo "shard-ubuntu: $RESULT - a shard failed, was cancelled or skipped"; exit 1; }
  check-macos:
    name: check (macos-latest)
    needs: shard-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
