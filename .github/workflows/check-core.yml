          gh run view "$GITHUB_RUN_ID" --json jobs > "$RUNNER_TEMP/jobs.json" && bash scripts/ci-times.sh --baseline tests/ci-times.tsv "$RUNNER_TEMP/jobs.json" |
            awk -v os=windows '$1 == "wall" || $2 == os { if ($1 == "over") print "::warning::ci-times: " $0; else print }' || echo "::warning::ci-times could not read this run"
          gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.name | startswith("shard-windows ")) | select(.completedAt | startswith("0001") | not) | if (.steps | length) == 0 then "\(.name) no runner" else "\(.name) \((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601))" end' |
            awk -v lim="$SHARD_LIMIT" '/ no runner$/ { print; next } { s = $NF; sub(/ [0-9]+$/, ""); if (s > lim) print "::warning::" $0 " took " s " s, over the shard limit of " lim; else print $0 " took " s " s" }' || echo "::warning::the shards times could not be read"
