name: check-core
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: a failing command anywhere in a pipeline fails the step
    steps:
      - uses: actions/checkout@v4
      - name: macOS runs the scripts with the system bash 3.2, not Homebrew's
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"
      - name: Which bash
        if: runner.os != 'Windows'
        run: |
          command -v bash
          bash --version | head -n 1
          if [ "$RUNNER_OS" = macOS ]; then bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]' || { echo "expected bash 3.2 on macOS"; exit 1; }; fi
      - name: Links and section references (bash)
        if: runner.os != 'Windows'
        run: bash scripts/check-core.sh
      - name: Links and section references (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\check-core.ps1
      - name: Every script parses, and a broken one is reported (bash)
        if: runner.os != 'Windows'
        run: |
          bash scripts/check-scripts.sh scripts
          out="$(bash scripts/check-scripts.sh tests/check-scripts/broken)" && { echo "broken scripts must fail"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^tests/check-scripts/broken/bad\.sh:[0-9]*: '
          printf '%s\n' "$out" | grep -q "^tests/check-scripts/broken/bad\.ps1:3: Variable reference is not valid. ':' was not followed by a valid variable name character"
          printf '%s\n' "$out" | grep -qx 'check-scripts: 3 files, 2 errors'
          bash scripts/check-scripts.sh tests/check-scripts/pwsh7 | grep -qx 'check-scripts: 1 files, 0 errors'
      - name: Every script parses, and a broken one is reported (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\check-scripts.ps1 scripts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = @(.\scripts\check-scripts.ps1 tests/check-scripts/broken)
          if ($LASTEXITCODE -ne 1) { "broken scripts must fail"; exit 1 }
          $out
          if (-not ($out -match '^tests/check-scripts/broken/bad\.sh:\d+: ')) { 'bad.sh not reported'; exit 1 }
          if (-not ($out -match "^tests/check-scripts/broken/bad\.ps1:3: Variable reference is not valid")) { 'bad.ps1 not reported'; exit 1 }
          if (-not ($out -ceq 'check-scripts: 3 files, 2 errors')) { 'wrong summary'; exit 1 }
          # a #Requires -Version 7 file: 5.1 cannot parse it, so check-scripts hands it to pwsh
          $t = $null; $x = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\tests\check-scripts\pwsh7\needs7.ps1", [ref]$t, [ref]$x)
          if ($x.Count -eq 0) { "needs7.ps1 must not parse under 5.1"; exit 1 }
          $out = @(.\scripts\check-scripts.ps1 tests/check-scripts/pwsh7)
          if ($LASTEXITCODE -ne 0 -or -not ($out -ceq 'check-scripts: 1 files, 0 errors')) { $out; 'needs7.ps1 not handed to pwsh'; exit 1 }
          exit 0
      - name: check-scripts.sh and .ps1 print the same on Windows (Git Bash, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: |
          for d in scripts tests/check-scripts/broken tests/check-scripts/pwsh7; do
            a="$(bash scripts/check-scripts.sh "$d")" || true
            b="$(powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-scripts.ps1 "$d" | tr -d '\r')" || true
            [ "$a" = "$b" ] || { echo "differ on $d"; printf '%s\n--\n%s\n' "$a" "$b"; exit 1; }
          done
      - name: selftest - the guard's settings and transcripts (bash)
        if: runner.os != 'Windows'
        run: |
          s=scripts/selftest.sh; h=tests/selftest/hooks
          bash $s hooks --settings $h/good.json
          bash $s hooks --settings $h/shellexit.json
          for f in shell backslash envvar; do
            if bash $s hooks --settings $h/$f.json; then echo "$f.json must fail"; exit 1; fi
          done
          export CLAUDE_CONFIG_DIR="$PWD/tests/selftest/claude"
          bash $s hookcheck --session blocked0
          for id in nonblock noblock0 missing0; do
            if bash $s hookcheck --session $id; then echo "$id must fail"; exit 1; fi
          done
      - name: selftest - the guard's settings and transcripts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $h = 'tests/selftest/hooks'
          foreach ($f in @('good', 'shellexit')) { .\scripts\selftest.ps1 hooks -Settings "$h/$f.json"; if ($LASTEXITCODE -ne 0) { "$f.json must pass"; exit 1 } }
          foreach ($f in @('shell', 'backslash', 'envvar')) { .\scripts\selftest.ps1 hooks -Settings "$h/$f.json"; if ($LASTEXITCODE -ne 1) { "$f.json must fail"; exit 1 } }
          $env:CLAUDE_CONFIG_DIR = "$PWD\tests\selftest\claude"
          .\scripts\selftest.ps1 hookcheck -Session blocked0; if ($LASTEXITCODE -ne 0) { 'blocked0 must pass'; exit 1 }
          foreach ($id in @('nonblock', 'noblock0', 'missing0')) { .\scripts\selftest.ps1 hookcheck -Session $id; if ($LASTEXITCODE -ne 1) { "$id must fail"; exit 1 } }
          exit 0
      - name: The example contract in CONTRACT.md passes the contract check (bash)
        if: runner.os != 'Windows'
        run: |
          awk '/^```yaml$/ {on = 1; next} on && /^```/ {exit} on' CONTRACT.md > "$RUNNER_TEMP/example.md"
          bash scripts/check-contract.sh "$RUNNER_TEMP/example.md"
      - name: The example contract in CONTRACT.md passes the contract check (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $s = [IO.File]::ReadAllText("$PWD\CONTRACT.md")
          $m = [regex]::Match($s, '(?s)```yaml\r?\n(.*?)```')
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\example.md", $m.Groups[1].Value)
          .\scripts\check-contract.ps1 "$env:RUNNER_TEMP\example.md"
          exit $LASTEXITCODE
      - name: session-tokens counts the fixture exactly (bash)
        if: runner.os != 'Windows'
        run: |
          export CLAUDE_CONFIG_DIR="$PWD/tests/session-tokens/claude"
          bash scripts/session-tokens.sh s1 | diff - tests/session-tokens/expected.txt
          bash scripts/session-tokens.sh s2 | diff - tests/session-tokens/expected-s2.txt
          if bash scripts/session-tokens.sh s 2>/dev/null; then echo "an ambiguous prefix must fail"; exit 1; fi
          bash scripts/session-tokens.sh --since 2026-10-05T17:00:00Z | diff - tests/session-tokens/expected-since.txt
          t="$RUNNER_TEMP/prune"; mkdir -p "$t/coordinator/sessions"
          touch -t 202001010000 "$t/coordinator/sessions/old.json"; touch "$t/coordinator/sessions/new.json"
          CLAUDE_CONFIG_DIR="$t" bash scripts/session-tokens.sh --prune >/dev/null
          [ "$(ls "$t/coordinator/sessions")" = "new.json" ] || { echo "--prune kept or deleted the wrong files"; exit 1; }
      - name: session-tokens counts the fixture exactly (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CLAUDE_CONFIG_DIR = "$PWD\tests\session-tokens\claude"
          foreach ($c in @(@('s1', 'expected.txt'), @('s2', 'expected-s2.txt'))) {
            $got = (.\scripts\session-tokens.ps1 $c[0]) -join "`n"
            $want = ([IO.File]::ReadAllText("$PWD\tests\session-tokens\$($c[1])") -replace "`r", '').TrimEnd("`n")
            if ($got -ne $want) { "got:`n$got`nwant:`n$want"; exit 1 }
          }
          $p = Start-Process powershell -ArgumentList '-NoProfile', '-File', '.\scripts\session-tokens.ps1', 's' -Wait -PassThru -NoNewWindow -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          if ($p.ExitCode -ne 1) { "an ambiguous prefix must fail"; exit 1 }
          $got = (.\scripts\session-tokens.ps1 -Since 2026-10-05T17:00:00Z) -join "`n"
          $want = ([IO.File]::ReadAllText("$PWD\tests\session-tokens\expected-since.txt") -replace "`r", '').TrimEnd("`n")
          if ($got -ne $want) { "since got:`n$got`nwant:`n$want"; exit 1 }
          # -Prune through -File, as the docs give it, in both PowerShells
          foreach ($shell in @('powershell', 'pwsh')) {
            $t = Join-Path $env:RUNNER_TEMP "prune-$shell"; $d = Join-Path $t 'coordinator\sessions'
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Set-Content -Path "$d\old.json" -Value '{}'; Set-Content -Path "$d\new.json" -Value '{}'
            (Get-Item "$d\old.json").LastWriteTime = (Get-Date).AddDays(-30)
            $env:CLAUDE_CONFIG_DIR = $t
            & $shell -NoProfile -File .\scripts\session-tokens.ps1 -Prune | Out-Null
            $left = (Get-ChildItem $d | ForEach-Object Name) -join ','
            if ($left -ne 'new.json') { "-Prune under ${shell}: left $left"; exit 1 }
          }
          exit 0
      - name: safety-guard blocks and allows the shared cases (bash, with jq)
        if: runner.os != 'Windows'
        run: |
          bash scripts/hooks/safety-guard.sh --self-test | grep -qx 'safety-guard: OK'
          bash tests/safety-guard/run.sh bash scripts/hooks/safety-guard.sh
      - name: safety-guard without jq (bash, the sed / awk JSON reader)
        if: runner.os != 'Windows'
        run: |
          # a PATH of symlinks to every command except jq
          nojq="$RUNNER_TEMP/nojq"; mkdir -p "$nojq"
          IFS=: read -r -a dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            for x in "$d"/*; do
              b="${x##*/}"
              [ "$b" = jq ] || [ ! -f "$x" ] || [ ! -x "$x" ] || [ -e "$nojq/$b" ] || ln -s "$x" "$nojq/$b"
            done
          done
          if PATH="$nojq" command -v jq; then echo "jq is still on PATH"; exit 1; fi
          PATH="$nojq" bash scripts/hooks/safety-guard.sh --self-test | grep -qx 'safety-guard: OK'
          PATH="$nojq" bash tests/safety-guard/run.sh bash scripts/hooks/safety-guard.sh
      - name: safety-guard blocks and allows the shared cases (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hooks/safety-guard.ps1 -SelfTest | tr -d '\r' | grep -qx 'safety-guard: OK'
          bash tests/safety-guard/run.sh powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hooks/safety-guard.ps1
      - name: safety-guard.ps1 under PowerShell 7 too (Linux)
        if: runner.os == 'Linux'
        run: bash tests/safety-guard/run.sh pwsh -NoProfile -File scripts/hooks/safety-guard.ps1
      - name: start-worker and cleanup-worker against temporary repositories (bash)
        if: runner.os != 'Windows'
        run: bash tests/workers/run.sh sh
      - name: start-worker and cleanup-worker against temporary repositories (PowerShell 7, Linux)
        if: runner.os == 'Linux'
        run: bash tests/workers/run.sh ps pwsh
      - name: start-worker and cleanup-worker against temporary repositories (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: bash tests/workers/run.sh ps powershell
      - name: selftest - the scripted steps (bash)
        if: runner.os != 'Windows'
        run: |
          bash scripts/selftest.sh scripts
          # no claude on the runner: env must fail on it and still report git
          out="$(bash scripts/selftest.sh env)" && { echo "env must fail without claude"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qx 'FAIL env: claude not found'
          printf '%s\n' "$out" | grep -q '^PASS env: git '
          # a sandbox with a merged and an unmerged branch: kept while one is left, removed once merged
          out="$(bash scripts/selftest.sh sandbox)"; printf '%s\n' "$out"
          d="$(printf '%s\n' "$out" | sed -n 's/^sandbox: //p')"; r="$d/repo"
          g() { git -c user.email=t@t -c user.name=t "$@"; }
          git -C "$r" worktree add -q -b t1 "$r/.claude/worktrees/t1" main
          echo a > "$r/.claude/worktrees/t1/a.txt"; git -C "$r/.claude/worktrees/t1" add a.txt; g -C "$r/.claude/worktrees/t1" commit -q -m a
          if bash scripts/selftest.sh clean --sandbox "$d"; then echo "an unmerged branch must fail clean"; exit 1; fi
          [ -d "$d" ] || { echo "the sandbox was removed with a branch left"; exit 1; }
          g -C "$r" merge -q --no-edit t1
          bash scripts/selftest.sh clean --sandbox "$d"
          [ ! -e "$d" ] || { echo "the sandbox is still there"; exit 1; }
          if bash scripts/selftest.sh clean --sandbox "$HOME"; then echo "a folder without the marker must fail"; exit 1; fi
          [ -d "$HOME" ]
      - name: selftest - prepare and verify in a project's state repository (bash)
        if: runner.os != 'Windows'
        run: |
          t="$RUNNER_TEMP/st-project"; s="$t/coordinator"; c=abc1234; w="$t/.claude/worktrees"
          g() { git -c user.email=t@t -c user.name=t "$@"; }
          git init -q -b main "$t"; g -C "$t" commit -q --allow-empty -m p
          git init -q -b state "$s"; g -C "$s" commit -q --allow-empty -m s; printf 'coordinator/\n' >> "$t/.git/info/exclude"
          bash scripts/selftest.sh prepare --project "$t" --state "$s" --core $c | tee "$RUNNER_TEMP/prep.txt"
          grep -qx 'PASS prepare: added .claude/worktrees/ to the project'"'"'s info/exclude' "$RUNNER_TEMP/prep.txt"
          if bash scripts/selftest.sh prepare --project "$t" --state "$s" --core $c; then echo "a tested commit must be refused"; exit 1; fi
          git -C "$s" worktree add -q -b "selftest/$c/st1" "$w/selftest/$c/st1" "selftest/$c/base"
          echo a > "$w/selftest/$c/st1/a.txt"; git -C "$w/selftest/$c/st1" add a.txt; g -C "$w/selftest/$c/st1" commit -q -m a
          if bash scripts/selftest.sh verify --project "$t" --state "$s" --core $c; then echo "an unmerged st1 must fail verify"; exit 1; fi
          git -C "$s" worktree add -q "$w/selftest/$c/base" "selftest/$c/base"; g -C "$w/selftest/$c/base" merge -q --no-ff --no-edit "selftest/$c/st1"
          bash scripts/selftest.sh verify --project "$t" --state "$s" --core $c
          [ -z "$(git -C "$t" status --porcelain)" ] || { echo "the project's git sees the test"; exit 1; }
          [ "$(git -C "$s" branch --list 'selftest/*' | wc -l)" -eq 2 ] || { echo "the evidence branches were deleted"; exit 1; }
      - name: selftest - prepare and verify in a project's state repository (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'st-project'; $s = Join-Path $t 'coordinator'; $c = 'abc1234'; $w = Join-Path $t '.claude/worktrees'
          git init -q -b main $t; git -C $t -c user.email=t@t -c user.name=t commit -q --allow-empty -m p
          git init -q -b state $s; git -C $s -c user.email=t@t -c user.name=t commit -q --allow-empty -m s
          Add-Content -Path (Join-Path $t '.git/info/exclude') -Value 'coordinator/'
          .\scripts\selftest.ps1 prepare -Project $t -State $s -Core $c
          if ($LASTEXITCODE -ne 0) { 'prepare failed'; exit 1 }
          .\scripts\selftest.ps1 prepare -Project $t -State $s -Core $c
          if ($LASTEXITCODE -ne 1) { 'a tested commit must be refused'; exit 1 }
          git -C $s worktree add -q -b "selftest/$c/st1" "$w/selftest/$c/st1" "selftest/$c/base"
          Set-Content -Path "$w/selftest/$c/st1/a.txt" -Value a
          git -C "$w/selftest/$c/st1" add a.txt; git -C "$w/selftest/$c/st1" -c user.email=t@t -c user.name=t commit -q -m a
          .\scripts\selftest.ps1 verify -Project $t -State $s -Core $c
          if ($LASTEXITCODE -ne 1) { 'an unmerged st1 must fail verify'; exit 1 }
          git -C $s worktree add -q "$w/selftest/$c/base" "selftest/$c/base"
          git -C "$w/selftest/$c/base" -c user.email=t@t -c user.name=t merge -q --no-ff --no-edit "selftest/$c/st1"
          .\scripts\selftest.ps1 verify -Project $t -State $s -Core $c
          if ($LASTEXITCODE -ne 0) { 'verify failed after the merge'; exit 1 }
          if (git -C $t status --porcelain) { "the project's git sees the test"; exit 1 }
          if (@(git -C $s branch --list 'selftest/*').Count -ne 2) { 'the evidence branches were deleted'; exit 1 }
          exit 0
      - name: selftest - the scripted steps (Windows PowerShell 5.1, and pwsh)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $out = @(.\scripts\selftest.ps1 scripts); $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ($out -ceq 'PASS scripts: session-tokens (5.1)') -or -not ($out -ceq 'PASS scripts: session-tokens (7)')) { 'not run under both PowerShells'; exit 1 }
          $out = @(.\scripts\selftest.ps1 sandbox); $out
          $d = ($out | Where-Object { $_ -like 'sandbox: *' }).Substring(9); $r = Join-Path $d 'repo'
          git -C $r worktree add -q -b t1 (Join-Path $r '.claude/worktrees/t1') main
          Set-Content -Path (Join-Path $r '.claude/worktrees/t1/a.txt') -Value a
          git -C (Join-Path $r '.claude/worktrees/t1') add a.txt
          git -C (Join-Path $r '.claude/worktrees/t1') -c user.email=t@t -c user.name=t commit -q -m a
          .\scripts\selftest.ps1 clean -Sandbox $d
          if ($LASTEXITCODE -ne 1 -or -not (Test-Path -LiteralPath $d)) { 'an unmerged branch must fail clean and keep the sandbox'; exit 1 }
          git -C $r -c user.email=t@t -c user.name=t merge -q --no-edit t1
          .\scripts\selftest.ps1 clean -Sandbox $d
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $d)) { 'the merged sandbox was not removed'; exit 1 }
          exit 0
      - name: Both variants print the same (pwsh on Linux)
        if: runner.os == 'Linux'
        run: |
          diff <(bash scripts/check-core.sh) <(pwsh -NoProfile -File scripts/check-core.ps1)
          diff <(bash scripts/selftest.sh scripts) <(pwsh -NoProfile -File scripts/selftest.ps1 scripts)
          for f in good shell shellexit backslash envvar; do diff <(bash scripts/selftest.sh hooks --settings tests/selftest/hooks/$f.json) <(pwsh -NoProfile -File scripts/selftest.ps1 hooks -Settings tests/selftest/hooks/$f.json); done
          for id in blocked0 nonblock noblock0 missing0; do diff <(CLAUDE_CONFIG_DIR=tests/selftest/claude bash scripts/selftest.sh hookcheck --session $id) <(CLAUDE_CONFIG_DIR=tests/selftest/claude pwsh -NoProfile -File scripts/selftest.ps1 hookcheck -Session $id); done
          diff <(bash scripts/check-scripts.sh scripts tests/check-scripts/broken tests/check-scripts/pwsh7) <(pwsh -NoProfile -File scripts/check-scripts.ps1 scripts tests/check-scripts/broken tests/check-scripts/pwsh7)
          f="$RUNNER_TEMP/example.md"
          diff <(bash scripts/check-contract.sh "$f") <(pwsh -NoProfile -File scripts/check-contract.ps1 "$f")
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          for j in \
            '{"model":{"display_name":"Opus 5.5"},"effort":{"level":"high"},"context_window":{"used_percentage":84.2,"context_window_size":1000000,"current_usage":{"input_tokens":800000,"cache_read_input_tokens":37000}},"rate_limits":{"five_hour":{"used_percentage":14.9},"seven_day":{"used_percentage":92}}}' \
            '{"context_window":{"used_percentage":50,"context_window_size":1250000,"current_usage":null},"rate_limits":{"five_hour":{"used_percentage":null}}}'; do
            a="$(printf '%s' "$j" | HOME="$home" bash scripts/statusline.sh)"
            b="$(printf '%s' "$j" | HOME="$home" LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/statusline.ps1)"
            [ "$a" = "$b" ] || { echo "statusline differs: sh '$a' / ps '$b'"; exit 1; }
          done
          export CLAUDE_CONFIG_DIR="$PWD/tests/session-tokens/claude"
          for id in s1 s2; do
            diff <(bash scripts/session-tokens.sh $id) <(LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-tokens.ps1 $id)
          done
          # a non-UTC zone: PowerShell 7 parses the timestamps into dates
          diff <(bash scripts/session-tokens.sh --since 2026-10-05T17:00:00Z) \
               <(TZ=America/New_York pwsh -NoProfile -File scripts/session-tokens.ps1 -Since 2026-10-05T17:00:00Z)
