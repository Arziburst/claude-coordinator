        run: bash tests/selftest/sandbox.sh ps pwsh
      - name: selftest sandbox and clean --keep - a used sandbox reset, kept and reused; the refusals (Windows PowerShell 5.1 and pwsh)
        if: matrix.shard == 'windows-9' && steps.need.outputs.selftest == 'true'
        run: |
          bash tests/selftest/sandbox.sh ps powershell
          [ '${{ steps.need.outputs.winpwsh }}' = true ] || exit 0   # pwsh on Windows: not on a pull request (#561)
