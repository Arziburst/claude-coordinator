      - name: selftest prepare and verify - CORE-FINDINGS.md, a base only on the remote, a non-ASCII folder, the sessions left (Windows PowerShell 5.1 and pwsh, code page 866)
        if: matrix.shard == 'windows-1' && steps.need.outputs.selftest == 'true'
        run: |
