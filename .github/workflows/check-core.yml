          done
          for id in t1 t6; do
            diff <(CLAUDE_CONFIG_DIR=tests/session-tokens/edge bash scripts/session-tokens.sh $id) \
                 <(CLAUDE_CONFIG_DIR=tests/session-tokens/edge LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-tokens.ps1 $id)
          done
          # the cost-state record: its cost read the same under a decimal comma
          for id in c1 c2 c3 c4; do
            diff <(CLAUDE_CONFIG_DIR=tests/session-tokens/state bash scripts/session-tokens.sh $id) \
                 <(CLAUDE_CONFIG_DIR=tests/session-tokens/state LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-tokens.ps1 $id)
          done
          # run-stats: the same numbers under a locale with a decimal comma
          for f in tests/run-stats/*.tsv; do
            diff <(bash scripts/run-stats.sh $f) <(LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 $f)
            diff <(bash scripts/run-stats.sh $f --kind ordinary --model sonnet) <(LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 $f -Kind ordinary -Model sonnet)
            diff <(bash scripts/run-stats.sh $f --per-run) <(LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 $f -PerRun)
          done
          # run-stats --limits: the same lines under a decimal comma and another time zone
          l=tests/run-stats/limits
          for s in status-trusted status-fresh status-reset status-pretty; do
            diff <(bash scripts/run-stats.sh --limits --status $l/$s.json --spend-5h $l/spend-5h.txt --spend-week $l/spend-week.txt --prices $l/prices.txt --prev-5h 0.7 --cap-5h 95 --cap-week 90 --block 80 --block-top 3.3 --now 1791872400) \
                 <(TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 -Limits -Status $l/$s.json -Spend5h $l/spend-5h.txt -SpendWeek $l/spend-week.txt -Prices $l/prices.txt -Prev5h 0.7 -Cap5h 95 -CapWeek 90 -Block 80 -BlockTop 3.3 -Now 1791872400)
          done
          # run-stats --task: the same task row under a decimal comma and another time zone
          k=tests/run-stats/task
          for p in late early rerun open nochecks; do
            diff <(bash scripts/run-stats.sh $k/runs.tsv --task 40 --pr-json $k/pr-$p.json --waits $k/waits.txt) \
                 <(TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 $k/runs.tsv -Task 40 -PrJson $k/pr-$p.json -Waits $k/waits.txt)
          done
          # the time line: the transcripts' timestamps stay UTC in any zone and locale
          for id in g1 g2 g2t g3 g4 g5 g6; do
            diff <(CLAUDE_CONFIG_DIR=tests/session-tokens/time bash scripts/session-tokens.sh $id) \
                 <(CLAUDE_CONFIG_DIR=tests/session-tokens/time TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-tokens.ps1 $id)
          done
          # a non-UTC zone: Unix seconds and the transcripts' timestamps stay UTC
          for since in 2026-10-05T17:00:00Z 1791219600; do
            diff <(bash scripts/session-tokens.sh --since $since) \
                 <(TZ=America/New_York pwsh -NoProfile -File scripts/session-tokens.ps1 -Since $since)
            diff <(CLAUDE_CONFIG_DIR=tests/session-tokens/order bash scripts/session-tokens.sh --since $since) \
                 <(CLAUDE_CONFIG_DIR=tests/session-tokens/order TZ=America/New_York pwsh -NoProfile -File scripts/session-tokens.ps1 -Since $since)
          done
          # session-insights: the same lines under another time zone and a German locale
          for id in b1 e1 e0 r1 sub1 a1; do
            diff <(CLAUDE_CONFIG_DIR=tests/session-insights/claude bash scripts/session-insights.sh $id --detail) \
                 <(CLAUDE_CONFIG_DIR=tests/session-insights/claude TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-insights.ps1 $id -Detail)
          done
          for since in 2026-10-05T17:00:00Z 1791219600; do
            diff <(CLAUDE_CONFIG_DIR=tests/session-insights/multi bash scripts/session-insights.sh --since $since) \
                 <(CLAUDE_CONFIG_DIR=tests/session-insights/multi TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-insights.ps1 -Since $since)
          done
          # session-insights' retro filters, and the retro's report and public body: the same under another
          # time zone and a German locale
          r=tests/retro
          for p in C:/work/acme-shop 'C:/work/acme-shop|C:/work/acme-shop-wt'; do
            diff <(CLAUDE_CONFIG_DIR=$r/claude bash scripts/session-insights.sh --since 2026-10-05T00:00:00Z --until 2026-10-12T00:00:00Z --skip-tests --project "$p") \
                 <(CLAUDE_CONFIG_DIR=$r/claude TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/session-insights.ps1 -Since 2026-10-05T00:00:00Z -Until 2026-10-12T00:00:00Z -SkipTests -Project "$p")
          done
          # run-stats --task on a real run log (a verifier's pass and Done): the same row
          for n in 50 53; do
            diff <(bash scripts/run-stats.sh tests/run-stats/real.tsv --task $n) <(LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/run-stats.ps1 tests/run-stats/real.tsv -Task $n)
          done
          for w in 2026-10-07 2026-09-30; do
            diff <(CLAUDE_CONFIG_DIR=$r/claude bash scripts/retro.sh $r/coordinator/RUNS.tsv --week $w --project C:/work/acme-shop) \
                 <(CLAUDE_CONFIG_DIR=$r/claude TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/retro.ps1 $r/coordinator/RUNS.tsv -Week $w -Project C:/work/acme-shop)
            diff <(CLAUDE_CONFIG_DIR=$r/claude bash scripts/retro.sh $r/coordinator/RUNS.tsv --week $w --project C:/work/acme-shop --public --id 3f9a0c1b7e42) \
                 <(CLAUDE_CONFIG_DIR=$r/claude TZ=America/New_York LC_ALL=de_DE.UTF-8 pwsh -NoProfile -File scripts/retro.ps1 $r/coordinator/RUNS.tsv -Week $w -Project C:/work/acme-shop -Public -Id 3f9a0c1b7e42)
          done
      - name: ci-times - the shards hold every step, ci-times on its fixtures, a failing guard case prints the hook's stderr (bash)
        if: (matrix.shard == 'ubuntu-7' || matrix.shard == 'macos-2') && steps.need.outputs.citimes == 'true'
